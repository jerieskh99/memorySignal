<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analysis Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===== tokens: identical to plan07_campaign/ui/capture_console.template.html ===== */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f5f7fa; --sunk:#eaeef3;
  --ink:#151b24; --ink-2:#48545f; --ink-3:#78838f; --line:#dbe1e9; --line-2:#c8d0da;
  --accent:#0f8ba3; --accent-ink:#ffffff; --accent-soft:#d3edf2;
  --ok:#1c8a4e; --ok-soft:#d5efdf; --warn:#a86a08; --warn-soft:#f8e9c9; --bad:#c23b3b; --bad-soft:#f6d9d9;
  --trace:#0f8ba3; --amber:#b8860b; --violet:#6d28d9; --grid:#dfe4ea;
  --shadow:0 1px 2px rgba(20,27,36,.06),0 8px 24px -12px rgba(20,27,36,.18);
  --t-cells:#78838f; --t-field:#0f8ba3; --t-complex:#6d28d9; --t-series:#1c8a4e;
  --t-tiles:#2563eb; --t-features:#d97706; --t-reference:#b8860b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1017; --panel:#141b25; --panel-2:#101720; --sunk:#0b1119;
    --ink:#e8edf3; --ink-2:#9aa7b4; --ink-3:#69757f; --line:#232e3b; --line-2:#2e3b4a;
    --accent:#38c6dc; --accent-ink:#04121a; --accent-soft:#123039;
    --ok:#4ade80; --ok-soft:#122a1c; --warn:#fbbf24; --warn-soft:#2c2411; --bad:#f87171; --bad-soft:#2e1618;
    --trace:#38c6dc; --amber:#fbbf24; --violet:#a78bfa; --grid:#182130;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
    --t-cells:#9aa7b4; --t-field:#38c6dc; --t-complex:#a78bfa; --t-series:#4ade80;
    --t-tiles:#60a5fa; --t-features:#fbbf24; --t-reference:#f59e0b;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1017; --panel:#141b25; --panel-2:#101720; --sunk:#0b1119;
  --ink:#e8edf3; --ink-2:#9aa7b4; --ink-3:#69757f; --line:#232e3b; --line-2:#2e3b4a;
  --accent:#38c6dc; --accent-ink:#04121a; --accent-soft:#123039;
  --ok:#4ade80; --ok-soft:#122a1c; --warn:#fbbf24; --warn-soft:#2c2411; --bad:#f87171; --bad-soft:#2e1618;
  --trace:#38c6dc; --amber:#fbbf24; --violet:#a78bfa; --grid:#182130;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
  --t-cells:#9aa7b4; --t-field:#38c6dc; --t-complex:#a78bfa; --t-series:#4ade80;
  --t-tiles:#60a5fa; --t-features:#fbbf24; --t-reference:#f59e0b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:13.5px; line-height:1.45; overflow:hidden; display:flex; flex-direction:column}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
h1,h2,h3{margin:0}
button{font:inherit; cursor:pointer} input,select{font:inherit; color:inherit}

.top{flex:none; background:var(--panel); border-bottom:1px solid var(--line); padding:9px 16px; display:flex; align-items:center; gap:10px; z-index:30}
.brandmark{width:26px;height:26px;flex:none}
.brand h1{font-size:15px; font-weight:600; line-height:1.2} .brand .sub{font-size:11.5px; color:var(--ink-3)}
.top .spacer{flex:1}
.top input.label{width:200px; padding:7px 10px; background:var(--sunk); border:1px solid var(--line-2); border-radius:8px; outline:none; font-family:"IBM Plex Mono",monospace; font-size:12.5px}
.top input.label:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.top select{padding:7px 9px; background:var(--sunk); border:1px solid var(--line-2); border-radius:8px; font-size:12.5px}
.bigbtn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:600}
.bigbtn:hover{filter:brightness(1.06)} .bigbtn:disabled{opacity:.4; cursor:not-allowed}
.bigbtn.ghost{background:var(--panel-2); color:var(--ink-2); border:1px solid var(--line-2)} .bigbtn.ghost:hover{border-color:var(--accent); color:var(--ink)}
.tbtn{background:var(--panel-2); border:1px solid var(--line-2); color:var(--ink-2); width:32px;height:32px;border-radius:8px; display:grid;place-items:center}
.tbtn:hover{color:var(--ink); border-color:var(--accent)}
.buildbar{flex:none; background:var(--panel-2); color:var(--ink-2); font-size:11px; padding:5px 16px; border-bottom:1px solid var(--line); display:flex; gap:14px; flex-wrap:wrap}
.buildbar b{color:var(--ink)} .buildbar .warn{color:var(--warn)}

.app{flex:1; min-height:0; display:grid; grid-template-columns:236px minmax(0,1fr) 380px}
@media(max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr) 330px}}

.palette{background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px 10px 30px}
.tier{margin-bottom:12px}
.tier-h{display:flex; align-items:baseline; gap:8px; padding:6px 6px 5px}
.tier-h .idx{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--accent); font-weight:600; letter-spacing:.06em}
.tier-h h2{font-size:12px; font-weight:600}
.tier-h .n{margin-left:auto; font-size:10px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
.mod{display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border:1px solid var(--line-2); border-radius:9px; background:var(--panel-2); margin-bottom:6px; cursor:grab; user-select:none}
.mod:hover{border-color:var(--accent)} .mod:active{cursor:grabbing}
.mod.unbuilt{opacity:.55; border-style:dashed; cursor:not-allowed}
.mod .ico{width:20px;height:20px; border-radius:6px; flex:none; display:grid; place-items:center; font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; color:#fff}
.mod .t{font-size:12px; font-weight:600; line-height:1.25; display:flex; gap:5px; align-items:center; flex-wrap:wrap}
.mod .d{font-size:10.5px; color:var(--ink-3); line-height:1.3; margin-top:1px}
.mod .io{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--ink-3); margin-top:3px; display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.dot{display:inline-block; width:7px;height:7px; border-radius:50%; background:var(--t-field)}
.pal-help{font-size:11px; color:var(--ink-3); padding:4px 6px 10px; line-height:1.4}

.mid{display:flex; flex-direction:column; min-height:0; min-width:0}
.canvas{position:relative; overflow:hidden; background:var(--bg); background-image:radial-gradient(var(--grid) 1px, transparent 1px); background-size:22px 22px; cursor:grab; flex:1; min-height:0}
.drawer{flex:none; border-top:1px solid var(--line); background:var(--panel); max-height:46%; display:flex; flex-direction:column; min-height:0}
.drawer.collapsed .tab{display:none}
.tabs{display:flex; align-items:center; gap:2px; padding:5px 10px; border-bottom:1px solid var(--line); background:var(--panel-2)}
.tabs button[data-tab]{border:none; background:none; color:var(--ink-2); padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600}
.tabs button[data-tab].on{background:var(--accent); color:var(--accent-ink)}
.tabs .tabs-sp{flex:1} .tbtn.small{width:26px;height:26px}
.bridge-st{font-family:"IBM Plex Mono",monospace; font-size:10px; padding:2px 7px; border-radius:5px; background:var(--sunk); color:var(--ink-3)}
.bridge-st.ok{background:var(--ok-soft); color:var(--ok)} .bridge-st.bad{background:var(--bad-soft); color:var(--bad)}
.tab{padding:9px 12px 10px; overflow:auto; min-height:0}
.src-ssh,.src-local{display:none} .drawer[data-kind="ssh"] .src-ssh{display:block} .drawer[data-kind="local"] .src-local{display:block}
.runstat{font-size:11.5px; color:var(--ink-2); line-height:1.4} .runstat b{color:var(--ink)}
.runlog{max-height:120px; margin-top:8px; font-size:10px}
.runlist{display:flex; flex-direction:column; gap:3px; max-height:190px; overflow:auto}
.runlist button{text-align:left; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2); border-radius:6px; padding:4px 8px; font-size:11px; font-family:"IBM Plex Mono",monospace}
.runlist button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}
.runlist button .st{float:right; font-size:9.5px}
.canvas.panning{cursor:grabbing}
.world{position:absolute; left:0; top:0; transform-origin:0 0}
.edges{position:absolute; left:0; top:0; overflow:visible; width:1px; height:1px; pointer-events:none}
.edges path{fill:none; stroke-width:2.4; pointer-events:stroke; cursor:pointer}
.edges path.hit{stroke:transparent; stroke-width:14}
.edges path.sel{stroke-width:3.4; filter:drop-shadow(0 0 3px var(--accent))}
.edges path.temp{stroke:var(--accent); stroke-dasharray:6 5; stroke-width:2}
.canvas-hint{position:absolute; left:14px; bottom:12px; font-size:11px; color:var(--ink-3); pointer-events:none; display:flex; gap:14px; flex-wrap:wrap}
.canvas-hint b{color:var(--ink-2)}
.zoomctl{position:absolute; right:12px; bottom:12px; display:flex; gap:4px}
.zoomctl button{width:28px;height:28px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2); border-radius:7px; font-weight:600}
.zoomctl button:hover{border-color:var(--accent); color:var(--ink)}

.node{position:absolute; width:214px; background:var(--panel); border:1.5px solid var(--line-2); border-radius:12px; box-shadow:var(--shadow); user-select:none}
.node.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}
.node.hard{border-color:var(--bad)} .node.soft{border-color:var(--warn)}
.node-h{display:flex; align-items:center; gap:7px; padding:8px 10px 7px; border-bottom:1px solid var(--line); cursor:grab; border-radius:12px 12px 0 0; background:var(--panel-2)}
.node-h .ico{width:18px;height:18px; border-radius:5px; flex:none; display:grid; place-items:center; font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:700; color:#fff}
.node-h .t{font-size:12.5px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.node-h .st{font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px}
.node-h .st.hard{background:var(--bad-soft); color:var(--bad)} .node-h .st.soft{background:var(--warn-soft); color:var(--warn)} .node-h .st.ok{background:var(--ok-soft); color:var(--ok)}
.node-b{padding:6px 0 8px; position:relative}
.node-sum{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-2); padding:2px 12px 6px; line-height:1.45; word-break:break-word}
.node-sum .k{color:var(--ink-3)}
.ports{display:flex; justify-content:space-between; gap:8px}
.pcol{display:flex; flex-direction:column; gap:5px; min-width:0}
.pcol.in{align-items:flex-start} .pcol.out{align-items:flex-end}
.prow{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-2); height:18px; position:relative}
.pcol.out .prow{flex-direction:row-reverse}
.prow .lab{white-space:nowrap} .prow .lab i{font-style:normal; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:9px; margin-left:3px}
.port{width:12px;height:12px; border-radius:50%; border:2px solid var(--panel); box-shadow:0 0 0 1.5px var(--line-2); flex:none; cursor:crosshair; position:relative}
.pcol.in .port{margin-left:-7px} .pcol.out .port{margin-right:-7px}
.port:hover{transform:scale(1.25)} .port.req::after{content:""; position:absolute; inset:2px; border-radius:50%; background:var(--panel); opacity:.55}
.port.linked.req::after{display:none}
.port.can{box-shadow:0 0 0 3px var(--ok-soft), 0 0 0 1.5px var(--ok)} .port.cant{opacity:.35}
.node-flags{display:flex; gap:4px; flex-wrap:wrap; padding:0 12px 4px}

.flag{display:inline-flex; align-items:center; gap:4px; font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:600; padding:1px 6px; border-radius:5px; letter-spacing:.02em; cursor:help; position:relative; white-space:nowrap}
.flag.do_not_use{background:var(--bad-soft); color:var(--bad)} .flag.caution{background:var(--warn-soft); color:var(--warn)} .flag.note{background:var(--sunk); color:var(--ink-3)}
.flag.unverified{outline:1px dashed currentColor}
.hovercard{position:absolute; z-index:80; left:0; top:calc(100% + 7px); width:310px; background:var(--panel); border:1px solid var(--line-2); border-radius:10px; box-shadow:var(--shadow); padding:10px 12px; display:none;
  font-family:"IBM Plex Sans",sans-serif; font-weight:400; letter-spacing:0; white-space:normal; cursor:auto; text-align:left}
.flag:hover .hovercard, .flag:focus-within .hovercard{display:block}
.hovercard .hc-h{font-size:12px; font-weight:600; margin-bottom:3px; color:var(--ink)}
.hovercard .hc-d{font-size:11.5px; color:var(--ink-2); line-height:1.45}
.hovercard .hc-s{margin-top:6px; padding-top:6px; border-top:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--ink-3); word-break:break-all}
.hovercard .hc-v{font-family:"IBM Plex Mono",monospace; font-size:9.5px; margin-top:4px} .hc-v.ok{color:var(--ok)} .hc-v.no{color:var(--warn)}

.right{background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
.insp{flex:1; min-height:0; overflow-y:auto; padding:12px 14px 16px; border-bottom:1px solid var(--line)}
.readout{flex:none; max-height:46%; overflow-y:auto; padding:10px 14px 14px; background:var(--panel-2)}
.sec-h{display:flex; align-items:baseline; gap:8px; margin:0 0 8px}
.sec-h .idx{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--accent); font-weight:600; letter-spacing:.06em}
.sec-h h2{font-size:12.5px; font-weight:600} .sec-h .hint{margin-left:auto; font-size:10.5px; color:var(--ink-3)}
.insp-empty{color:var(--ink-3); font-size:12px; padding:22px 4px; text-align:center; line-height:1.5}
.insp .desc{font-size:11.5px; color:var(--ink-3); margin:-2px 0 10px; line-height:1.45}
label.fl{display:block; font-size:10.5px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em; margin:0 0 5px}
.field + .field{margin-top:11px}
.row{display:flex; gap:9px} .row > .field{flex:1; min-width:0}
input[type=text],input[type=number],select.f{width:100%; padding:7px 9px; background:var(--sunk); border:1px solid var(--line-2); border-radius:8px; outline:none; font-size:12.5px}
input:focus,select.f:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.cols{display:flex; flex-wrap:wrap; gap:5px}
.col{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:3px 7px; border-radius:6px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2); position:relative}
.col.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.col.dead{opacity:.5; text-decoration:line-through; cursor:not-allowed; border-style:dashed}
.col.fbad::after,.col.fwarn::after{content:"!"; position:absolute; top:-5px; right:-4px; width:11px;height:11px; border-radius:50%; background:var(--bad); color:#fff; font-size:8.5px; font-weight:700; line-height:11px; text-align:center; font-family:"IBM Plex Sans",sans-serif}
.col.fwarn::after{background:var(--warn)} .col.prop{border-style:dotted}
.grp{border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:7px}
.grp-h{display:flex; align-items:center; gap:8px; padding:6px 9px; background:var(--panel-2); font-size:11.5px; font-weight:600; text-transform:capitalize}
.grp-h .fam{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--ink-3); font-weight:500; text-transform:none}
.grp-h .seg{margin-left:auto; display:inline-flex; gap:2px}
.grp-h .seg button{border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2); padding:1px 7px; border-radius:5px; font-size:10px; font-weight:600}
.grp .cols{padding:7px 9px}
.iolist{font-size:11.5px; display:flex; flex-direction:column; gap:4px; margin-top:4px}
.iolist .r{display:flex; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-2)}
.iolist .r .s{margin-left:auto; font-size:9.5px; color:var(--ink-3)} .iolist .r .s.on{color:var(--ok)}
.tbl{width:100%; border-collapse:collapse; font-size:11px}
.tbl th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:600; padding:4px 5px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel)}
.tbl td{padding:4px 5px; border-bottom:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:10.5px; vertical-align:top}
.tbl tr.off td{opacity:.42} .tbl .cb{accent-color:var(--accent); width:13px;height:13px}
.tblwrap{max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px}
.pill{font-family:"IBM Plex Mono",monospace; font-size:9px; padding:1px 5px; border-radius:4px; background:var(--sunk); color:var(--ink-3); white-space:nowrap}
.pill.have{background:var(--ok-soft); color:var(--ok)} .pill.none{background:var(--bad-soft); color:var(--bad)} .pill.warn{background:var(--warn-soft); color:var(--warn)}
.bdg{font-family:"IBM Plex Mono",monospace; font-size:9.5px; padding:1px 5px; border-radius:4px; background:var(--accent-soft); color:var(--accent); font-weight:500}
.subnote{font-size:11px; color:var(--ink-3); margin-top:8px; line-height:1.45} .subnote b{color:var(--ink-2)}
.famfilter{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px}
.famfilter button{font-family:"IBM Plex Mono",monospace; font-size:10px; padding:2px 7px; border-radius:5px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2)}
.famfilter button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

.cons{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.cons-item{border-radius:8px; padding:7px 10px; font-size:11.5px; line-height:1.42; display:flex; gap:7px; align-items:flex-start}
.cons-item.hard{background:var(--bad-soft); color:var(--bad)} .cons-item.soft{background:var(--warn-soft); color:var(--warn)} .cons-item.note{background:var(--sunk); color:var(--ink-2)}
.cons-item .cbody{flex:1} .cons-item .csrc{font-family:"IBM Plex Mono",monospace; font-size:9.5px; opacity:.8; display:block; margin-top:2px}
.cons-item .fixbtn{background:transparent; border:1px solid currentColor; color:inherit; border-radius:6px; padding:2px 8px; font-size:10.5px; font-weight:600; flex:none}
.cons-item .who{font-weight:600; cursor:pointer; text-decoration:underline dotted}
.ack{display:flex; gap:6px; align-items:center; font-size:11px; margin-top:5px; font-weight:600} .ack input{accent-color:currentColor; width:14px;height:14px}
.ack input[type=text]{width:100%; font-weight:400; margin-top:4px; padding:4px 7px; font-size:11px}
.dial-wrap{display:flex; gap:12px; align-items:center; margin-top:8px}
.danger{margin-top:14px; display:flex; gap:8px}
.danger button{border:1px solid var(--line-2); background:var(--panel-2); color:var(--ink-2); border-radius:7px; padding:5px 10px; font-size:11.5px; font-weight:600}
.danger button.del:hover{border-color:var(--bad); color:var(--bad)}

.count{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.count .n{font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600; line-height:1; letter-spacing:-.02em}
.count .n.zero{color:var(--ink-3)} .count .u{font-size:11px; color:var(--ink-3)}
.count .formula{margin-left:auto; text-align:right; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-3); line-height:1.45}
.verdict{border-radius:8px; padding:7px 10px; font-size:11.5px; margin:6px 0 8px; font-weight:600}
.verdict.ok{background:var(--ok-soft); color:var(--ok)} .verdict.bad{background:var(--bad-soft); color:var(--bad)} .verdict.warn{background:var(--warn-soft); color:var(--warn)}
.out-h{display:flex; align-items:center; gap:8px; margin:8px 0 5px}
.out-h .lab{font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; color:var(--ink-3)}
.copy{margin-left:auto; background:var(--panel); border:1px solid var(--line-2); color:var(--ink-2); border-radius:6px; padding:3px 9px; font-size:11px; font-weight:600}

    m.outputs.map(o => `<div class="r"><span class="dot" style="background:${tcol(o.t)}"></span>out, ${esc(o.lab)} <span class="s ${outEdges(n.id).filter(e => e.fp === o.k).length ? "on" : ""}">${outEdges(n.id).filter(e => e.fp === o.k).length} pipe(s)</span></div>`).join("") + `</div></div>`;
  const mine = issues.filter(c => c.node === n.id);
  if (mine.length) h += `<div class="cons">` + mine.map((c, i) => `<div class="cons-item ${c.sev}"><div class="cbody"><b>${c.sev === "hard" ? "blocked" : c.sev === "soft" ? "warning" : "note"}</b>: ${esc(c.msg)}<span class="csrc">${esc(c.src)}</span>
      ${c.sev === "soft" ? `<label class="ack"><input type="checkbox" data-ack="${esc(c.id)}" ${G.acks.has(c.id) ? "checked" : ""}> I know; proceed, and record it in the scheme</label>${G.acks.has(c.id) ? `<input type="text" data-acknote="${esc(c.id)}" value="${esc(G.acks.get(c.id).note || "")}" placeholder="why (optional, goes into the scheme)">` : ""}` : ""}</div>
      ${c.fix ? `<button class="fixbtn" data-fix="${i}">${esc(c.fix.label)}</button>` : ""}</div>`).join("") + `</div>`;
  h += `<div class="danger"><button id="dup">duplicate</button><button class="del" id="del">remove module</button></div>`;
  host.innerHTML = h;
  host.querySelectorAll("[data-p]").forEach(inp => inp.addEventListener("change", () => { const q = m.params.find(x => x.k === inp.dataset.p); n.p[q.k] = q.kind === "number" ? parseFloat(inp.value) : inp.value; renderAll(); }));
  host.querySelectorAll("[data-multi]").forEach(b => b.onclick = () => { const arr = n.p[b.dataset.multi]; const i = arr.indexOf(b.dataset.v); i >= 0 ? arr.splice(i, 1) : arr.push(b.dataset.v); renderAll(); });
  host.querySelectorAll("[data-chan]").forEach(b => b.onclick = () => { const i = n.p.chans.indexOf(b.dataset.chan); i >= 0 ? n.p.chans.splice(i, 1) : n.p.chans.push(b.dataset.chan); renderAll(); });
  host.querySelectorAll("[data-grp]").forEach(b => b.onclick = () => { const cols = GROUPS[b.dataset.grp]; const recs = d ? d.recs : []; const sp = recs.length ? Math.max(...recs.map(r => recSpeed(r)[0])) : CONFIG.substrateSpeed; n.p.chans = n.p.chans.filter(c => !cols.includes(c)); if (b.dataset.m === "all") n.p.chans.push(...cols.filter(c => !deadFor(c, sp))); renderAll(); });
  host.querySelectorAll("[data-cell]").forEach(cb => cb.onchange = () => { cb.checked ? n.p.sel.push(cb.dataset.cell) : (n.p.sel = n.p.sel.filter(w => w !== cb.dataset.cell)); renderAll(); });
  host.querySelectorAll("[data-fam]").forEach(b => b.onclick = () => { famFilter = b.dataset.fam || null; renderAll(); });
  const sa = host.querySelector("[data-selall]"); if (sa) sa.onclick = () => { n.p.sel = RECS.filter(r => usable(r) && r.n_pairs >= n.p.min_pairs).map(r => r.id); renderAll(); };
  const sn = host.querySelector("[data-selnone]"); if (sn) sn.onclick = () => { n.p.sel = []; renderAll(); };
  host.querySelectorAll("[data-ack]").forEach(cb => cb.onchange = () => { cb.checked ? G.acks.set(cb.dataset.ack, {at: new Date().toISOString(), note: ""}) : G.acks.delete(cb.dataset.ack); renderAll(); });
  host.querySelectorAll("[data-acknote]").forEach(inp => inp.addEventListener("change", () => { const a = G.acks.get(inp.dataset.acknote); if (a) a.note = inp.value; renderReadout(validate()); }));
  host.querySelectorAll("[data-fix]").forEach(b => b.onclick = () => { mine[+b.dataset.fix].fix.run(); renderAll(); });
  host.querySelector("#del").onclick = () => { removeNode(n.id); renderAll(); };
  host.querySelector("#dup").onclick = () => { const c = addNode(n.mod, n.x + 30, n.y + 30, JSON.parse(JSON.stringify(n.p))); G.sel = c.id; renderAll(); };
}

function scheme() {
  return {schema: "plan10.scheme.v1", label: document.getElementById("label").value,
    nodes: G.nodes.map(n => ({id: n.id, module: n.mod, params: n.p, x: Math.round(n.x), y: Math.round(n.y)})),
    pipes: G.edges.map(e => ({from: [e.from, e.fp], to: [e.to, e.tp]})),
    acknowledged: [...G.acks].map(([id, a]) => ({id, at: a.at, note: a.note || ""})),
    built_from: {manifest_root: MANIFEST_CUR.root, manifest_scanned_at: MANIFEST_CUR.scanned_at, source: MANIFEST_CUR.source || null, roster_sha: ROSTER.derivation.source_sha256_16, config: CONFIG.source, console_built_at: BUILD.built_at}};
}
function renderReadout(issues) {
  const host = document.getElementById("readout"), est = estimate();
  const hard = issues.filter(c => c.sev === "hard"), soft = issues.filter(c => c.sev === "soft" && !isAcked(c));
  const verdict = hard.length ? `<div class="verdict bad">${hard.length} blocking; cannot save</div>` : soft.length ? `<div class="verdict warn">${soft.length} unacknowledged warning${soft.length > 1 ? "s" : ""}</div>` : `<div class="verdict ok">valid; every choice is explicit</div>`;
  let h = `<div class="sec-h"><span class="idx">CFG</span><h2>Readout</h2><span class="hint">${G.nodes.length} modules, ${G.edges.length} pipes</span></div>
    <div class="count"><span class="n ${est.nWl ? "" : "zero"}">${est.nWl}</span><span class="u">workloads<br>= effective n</span><span class="formula">${est.tiles.toLocaleString()} tiles = ${est.wins.toLocaleString()} windows x ${est.blocks.toLocaleString()} block${est.blocks === 1 ? "" : "s"}<br>windows are not evidence</span></div>${verdict}`;
  const shown = issues.filter(c => c.sev !== "note" && !(c.sev === "soft" && isAcked(c)));
  if (shown.length) h += `<div class="cons">` + shown.slice(0, 8).map(c => `<div class="cons-item ${c.sev}"><div class="cbody">${c.node ? `<span class="who" data-go="${c.node}">${esc(M[byId(c.node).mod].name)}</span>: ` : ""}${esc(c.msg)}</div></div>`).join("") + (shown.length > 8 ? `<div class="subnote">+${shown.length - 8} more</div>` : "") + `</div>`;
  if (G.acks.size) h += `<div class="subnote">acknowledged: <b>${esc([...G.acks.keys()].join(", "))}</b></div>`;
  h += `<div class="out-h"><span class="lab">scheme.json</span><button class="copy" id="copy">copy</button></div><pre class="code" id="code">${esc(JSON.stringify(scheme(), null, 1))}</pre>`;
  host.innerHTML = h;
  host.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { G.sel = el.dataset.go; G.selEdge = null; renderAll(); });
  host.querySelector("#copy").onclick = e => { navigator.clipboard.writeText(JSON.stringify(scheme(), null, 2)); e.target.classList.add("done"); e.target.textContent = "copied"; setTimeout(() => { e.target.classList.remove("done"); e.target.textContent = "copy"; }, 1400); };
  document.getElementById("gen").disabled = hard.length > 0 || soft.length > 0;
}
function renderAll() { const issues = validate(); renderNodes(issues); renderInspector(issues); renderReadout(issues); }

/* ===== interaction ===== */
let drag = null;
canvas.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
canvas.addEventListener("drop", e => { e.preventDefault(); const mod = e.dataTransfer.getData("text/module"); if (!mod) return; const [x, y] = toWorld(e.clientX, e.clientY); const n = addNode(mod, x - 107, y - 20); G.sel = n.id; G.selEdge = null; renderAll(); });
canvas.addEventListener("pointerdown", e => {
  const port = e.target.closest(".port"), head = e.target.closest(".node-h"), node = e.target.closest(".node"), edge = e.target.closest("path[data-edge]");
  if (port && port.dataset.dir === "out") { drag = {kind: "edge", from: port.dataset.node, fp: port.dataset.port, fromPt: portCenter(port.dataset.node, port.dataset.port, "out")};
    nodesHost.querySelectorAll(".port[data-dir='in']").forEach(p => p.classList.add(accepts(drag.from, drag.fp, p.dataset.node, p.dataset.port).ok ? "can" : "cant")); canvas.setPointerCapture(e.pointerId); e.preventDefault(); return; }
  if (head) { const n = byId(node.dataset.id); const [wx, wy] = toWorld(e.clientX, e.clientY); drag = {kind: "node", id: n.id, ox: wx - n.x, oy: wy - n.y}; G.sel = n.id; G.selEdge = null; renderAll(); canvas.setPointerCapture(e.pointerId); return; }
  if (node) { G.sel = node.dataset.id; G.selEdge = null; renderAll(); return; }
  if (edge) { G.selEdge = edge.dataset.edge; G.sel = null; renderAll(); return; }
  drag = {kind: "pan", sx: e.clientX, sy: e.clientY, vx: VIEW.x, vy: VIEW.y, moved: false}; canvas.classList.add("panning"); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!drag) return;
  if (drag.kind === "node") { const n = byId(drag.id); const [wx, wy] = toWorld(e.clientX, e.clientY); n.x = wx - drag.ox; n.y = wy - drag.oy; const el = nodesHost.querySelector(`.node[data-id="${n.id}"]`); el.style.left = n.x + "px"; el.style.top = n.y + "px"; drawEdges(); }
  else if (drag.kind === "pan") { VIEW.x = drag.vx + (e.clientX - drag.sx); VIEW.y = drag.vy + (e.clientY - drag.sy); drag.moved = true; applyView(); }
  else if (drag.kind === "edge") drawEdges([drag.fromPt, toWorld(e.clientX, e.clientY)]);
});
canvas.addEventListener("pointerup", e => {
  if (!drag) return;
  if (drag.kind === "edge") { nodesHost.querySelectorAll(".port").forEach(p => p.classList.remove("can", "cant")); const under = document.elementFromPoint(e.clientX, e.clientY); const p = under && under.closest(".port[data-dir='in']");
    if (p) { const r = accepts(drag.from, drag.fp, p.dataset.node, p.dataset.port); if (r.ok) connect(drag.from, drag.fp, p.dataset.node, p.dataset.port); else toast(r.why); } drag = null; renderAll(); return; }
  if (drag.kind === "pan") { canvas.classList.remove("panning"); if (!drag.moved) { G.sel = null; G.selEdge = null; renderAll(); } }
  if (drag.kind === "node") renderAll();
  drag = null;
});
canvas.addEventListener("wheel", e => { e.preventDefault(); const r = canvas.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top; const z2 = Math.min(2, Math.max(0.4, VIEW.z * (e.deltaY < 0 ? 1.1 : 0.9))); VIEW.x = mx - (mx - VIEW.x) * z2 / VIEW.z; VIEW.y = my - (my - VIEW.y) * z2 / VIEW.z; VIEW.z = z2; applyView(); drawEdges(); }, {passive: false});
document.getElementById("zin").onclick = () => { VIEW.z = Math.min(2, VIEW.z * 1.15); applyView(); drawEdges(); };
document.getElementById("zout").onclick = () => { VIEW.z = Math.max(0.4, VIEW.z / 1.15); applyView(); drawEdges(); };
document.getElementById("zfit").onclick = fit;
function fit() {
  if (!G.nodes.length) { VIEW = {x: 40, y: 30, z: 1}; applyView(); return; }
  const xs = G.nodes.map(n => n.x), ys = G.nodes.map(n => n.y); const minx = Math.min(...xs) - 30, miny = Math.min(...ys) - 30, maxx = Math.max(...xs) + 250, maxy = Math.max(...ys) + 170;
  const r = canvas.getBoundingClientRect(); const z = Math.min(1.2, Math.max(0.4, Math.min(r.width / (maxx - minx), r.height / (maxy - miny))));
  VIEW = {z, x: (r.width - (maxx - minx) * z) / 2 - minx * z, y: (r.height - (maxy - miny) * z) / 2 - miny * z}; applyView(); drawEdges();
}
window.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "Delete" || e.key === "Backspace") { if (G.sel) { removeNode(G.sel); renderAll(); } else if (G.selEdge) { G.edges = G.edges.filter(x => x.id !== G.selEdge); G.selEdge = null; renderAll(); } }
  if (e.key === "Escape") { G.sel = null; G.selEdge = null; renderAll(); }
});
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.opacity = "1"; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = "0", 1800); }

/* ===== schemes: load (examples, files) and save ===== */
function loadScheme(s) {
  G.nodes = []; G.edges = []; G.sel = null; G.selEdge = null; G.acks = new Map(); G.nextId = 1;
  (s.nodes || []).forEach(n => { if (!M[n.module]) { toast(`unknown module ${n.module}, skipped`); return; } addNode(n.module, n.x || 0, n.y || 0, n.params || {}, n.id); const num = parseInt(String(n.id).replace(/\D/g, ""), 10); if (num >= G.nextId) G.nextId = num + 1; });
  (s.pipes || []).forEach(p => { if (byId(p.from[0]) && byId(p.to[0]) && accepts(p.from[0], p.from[1], p.to[0], p.to[1]).ok) connect(p.from[0], p.from[1], p.to[0], p.to[1]); else toast(`pipe skipped: ${p.from.join(".")} to ${p.to.join(".")}`); });
  (s.acknowledged || []).forEach(a => { if (a && a.id) G.acks.set(a.id, {at: a.at || "", note: a.note || ""}); });
  if (s.label) document.getElementById("label").value = s.label;
  renderAll(); requestAnimationFrame(fit);
}
const exSel = document.getElementById("examples");
Object.keys(EXAMPLES).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = EXAMPLES[k].label; exSel.appendChild(o); });
const ob = document.createElement("option"); ob.value = "__blank"; ob.textContent = "blank canvas"; exSel.appendChild(ob);
exSel.addEventListener("change", e => { const v = e.target.value; if (v === "__blank") loadScheme({}); else if (v) loadScheme(JSON.parse(JSON.stringify(EXAMPLES[v]))); e.target.value = ""; });
document.getElementById("open").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { loadScheme(JSON.parse(rd.result)); } catch (err) { toast("not a scheme file: " + err.message); } }; rd.readAsText(f); e.target.value = ""; });
document.getElementById("validate").onclick = () => { renderAll(); const hard = validate().filter(c => c.sev === "hard"); if (hard.length) { G.sel = hard[0].node || null; renderAll(); } };
document.getElementById("gen").onclick = () => {
  const s = scheme(); const blob = new Blob([JSON.stringify(s, null, 2)], {type: "application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (s.label || "scheme") + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
document.getElementById("theme").onclick = () => { const cur = document.documentElement.getAttribute("data-theme"); const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; document.documentElement.setAttribute("data-theme", dark ? "light" : "dark"); renderAll(); };
window.addEventListener("resize", () => drawEdges());

renderBuildbar(); renderPalette(); applyView();
loadScheme(JSON.parse(JSON.stringify(EXAMPLES[Object.keys(EXAMPLES)[0]])));
window.__A = {G, M, validate, loadScheme, addNode, connect, renderAll, scheme, estimate, accepts, setManifest};


</script>
